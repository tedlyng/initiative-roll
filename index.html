<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Initiative Roller</title>
  <style>
    :root {
      --primary: #bb99ff;
      --text: rgba(255, 255, 255, 0.92);
      --text-2: rgba(255, 255, 255, 0.6);
      --paper: #222639;
      --line: rgba(255, 255, 255, 0.12);
      --hover: rgba(255, 255, 255, 0.06);
      font-family: Roboto, system-ui, -apple-system, sans-serif;
      font-size: 14px;
    }
    :root[data-mode="light"] {
      --line: rgba(0, 0, 0, 0.12);
      --hover: rgba(0, 0, 0, 0.05);
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; color: var(--text); background: var(--paper); }
    h1 { font-size: 16px; font-weight: 500; margin: 0 0 10px; }
    .gm-only { display: none; }
    body.gm .gm-only { display: block; }

    fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 0 0 10px; }
    legend { color: var(--text-2); font-size: 12px; padding: 0 4px; }
    .field { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 6px; margin: 4px 0; }
    .field label { color: var(--text-2); font-size: 13px; }
    input[type="text"], select {
      width: 100%; padding: 5px 7px; border-radius: 6px; border: 1px solid var(--line);
      background: var(--hover); color: var(--text); font: inherit;
    }
    select option { color: #000; }
    .check { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--text-2); margin: 4px 0; }

    .buttons { display: flex; gap: 8px; margin-bottom: 10px; }
    button {
      font: inherit; border-radius: 6px; padding: 7px 12px; cursor: pointer;
      border: 1px solid var(--line); background: transparent; color: var(--text);
    }
    button.primary { flex: 1; background: var(--primary); border-color: var(--primary); color: #111; font-weight: 500; }
    button:disabled { opacity: 0.5; cursor: default; }
    button:hover:not(:disabled) { filter: brightness(1.08); }

    #results-meta { color: var(--text-2); font-size: 12px; margin: 0 0 6px; }
    ol { list-style: none; margin: 0; padding: 0; }
    .row {
      display: grid; grid-template-columns: 22px 1fr auto 34px; gap: 8px; align-items: center;
      padding: 6px 6px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 4px;
    }
    .row:hover { background: var(--hover); }
    .row:first-child .pos { color: var(--primary); }
    .pos { color: var(--text-2); text-align: right; font-variant-numeric: tabular-nums; }
    .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .calc { color: var(--text-2); font-size: 12px; font-variant-numeric: tabular-nums; }
    .total { font-weight: 600; text-align: right; font-size: 15px; font-variant-numeric: tabular-nums; }
    .tag {
      font-size: 10px; margin-left: 6px; padding: 1px 5px; border-radius: 8px;
      border: 1px solid var(--line); color: var(--text-2); vertical-align: 1px;
    }
    .hidden-token .name { font-style: italic; opacity: 0.75; }
    #no-scene { color: var(--text-2); }
    .hint { color: var(--text-2); font-size: 12px; margin: 6px 0 2px; }
    body[data-method="bands"] .add-only, body:not([data-method="bands"]) .bands-only { display: none; }
  </style>
</head>
<body>
  <p id="no-scene" hidden>Open a scene to roll initiative.</p>
  <div id="main" hidden>
    <h1>Initiative</h1>

    <div class="gm-only">
      <fieldset>
        <legend>Settings</legend>
        <div class="field">
          <label for="mode">Method</label>
          <select id="mode">
            <option value="bands">d10: Low / Mid / High</option>
            <option value="add">Dice + one Init value</option>
          </select>
        </div>
        <div class="bands-only">
          <p class="hint">Owl Trackers names to read. d10: 1–2 Low, 3–8 Mid, 9–10 High.</p>
          <div class="field">
            <label for="low-name">Low (1–2)</label>
            <input id="low-name" type="text" placeholder="Init Low" />
          </div>
          <div class="field">
            <label for="mid-name">Middle (3–8)</label>
            <input id="mid-name" type="text" placeholder="Init Mid" />
          </div>
          <div class="field">
            <label for="high-name">High (9–10)</label>
            <input id="high-name" type="text" placeholder="Init High" />
          </div>
        </div>
        <div class="add-only">
          <div class="field">
            <label for="tracker-name">Owl Trackers name</label>
            <input id="tracker-name" type="text" placeholder="Init" />
          </div>
          <div class="field">
            <label for="dice">Dice to roll</label>
            <input id="dice" type="text" placeholder="1d20" />
          </div>
        </div>
        <div class="field">
          <label for="order">Order</label>
          <select id="order">
            <option value="desc">Highest first</option>
            <option value="asc">Lowest first</option>
          </select>
        </div>
        <label class="check"><input id="include-missing" type="checkbox" /> Include tokens missing an Init value</label>
        <label class="check"><input id="include-hidden" type="checkbox" /> Include hidden tokens</label>
      </fieldset>
      <div class="buttons">
        <button id="roll" class="primary">Roll initiative</button>
        <button id="clear">Clear</button>
      </div>
    </div>

    <p id="results-meta"></p>
    <ol id="results"></ol>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
